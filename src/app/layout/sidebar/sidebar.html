<div class="flex flex-col h-full bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 w-64 fixed inset-y-0 z-50">
  <!-- Sidebar header -->
  <div class="flex items-center justify-between p-4 border-b border-gray-200 dark:border-gray-700">
    <div class="flex items-center space-x-2">
      <div class="bg-blue-600 w-8 h-8 rounded-lg"></div>
      <span class="text-xl font-semibold text-gray-800 dark:text-white">SaaS Dashboard</span>
    </div>
  </div>

  <!-- Navigation menu -->
  <nav class="flex-1 px-2 py-4">
    @for (item of menuItems(); track item.route) {
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-400"
        class="flex items-center px-4 py-3 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors duration-200 mb-1">
        <lucide-icon [name]="item.icon" [size]="20" class="mr-3" />
        <span>{{ item.name }}</span>
      </a>
    }
  </nav>

  <!-- Sidebar footer -->
  <div class="p-4 border-t border-gray-200 dark:border-gray-700">
    <div class="flex items-center space-x-3">
      <div class="bg-gray-200 border-2 border-dashed rounded-xl w-10 h-10"></div>
      <div class="flex flex-col">
        <span class="text-sm font-medium text-gray-800 dark:text-white">John Doe</span>
        <span class="text-xs text-gray-500 dark:text-gray-400">Administrator</span>
      </div>
    </div>
  </div>
</div>
